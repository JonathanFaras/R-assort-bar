<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Réassort Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;
  --bg-2:#141414;
  --bg-3:#1c1c1c;
  --bg-card:rgba(255,255,255,0.04);
  --bg-card-hover:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.15);
  --text:#f5f0e6;
  --text-2:#a0958a;
  --text-3:#666058;
  --accent:#c89657;
  --accent-light:#e8b974;
  --accent-glow:rgba(200,150,87,0.25);
  --danger:#e85c52;
  --danger-glow:rgba(232,92,82,0.18);
  --danger-bg:rgba(232,92,82,0.08);
  --warn:#e8b974;
  --ok:#7ec97e;
  --ok-glow:rgba(126,201,126,0.18);
  --ok-bg:rgba(126,201,126,0.06);
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Manrope',-apple-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.4;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.app{min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 12px;
  background:var(--bg);
  position:sticky;top:0;z-index:10;
}
.header h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:24px;
  letter-spacing:-0.02em;
}
.header h1 span{color:var(--accent)}
.badge{
  background:var(--accent);color:#000;
  font-weight:700;font-size:12px;
  padding:4px 10px;border-radius:100px;
  letter-spacing:0.04em;
}

/* TOGGLE PILL (Comptoir / Bacs) */
.toggle-group{
  display:flex;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:100px;
  padding:4px;
  margin:0 18px 16px;
  position:relative;
}
.toggle-btn{
  flex:1;
  padding:12px 16px;
  background:transparent;
  border:none;
  color:var(--text-2);
  font-family:inherit;
  font-weight:600;
  font-size:14px;
  border-radius:100px;
  cursor:pointer;
  transition:all 0.25s ease;
  display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:0.01em;
}
.toggle-btn.active{
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);
  color:#1a0f02;
  box-shadow:0 4px 16px var(--accent-glow);
}

/* CONTENT */
.content{flex:1;padding:0 18px;padding-bottom:140px}

.section-title{
  font-family:'Fraunces',serif;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:0.15em;
  color:var(--text-3);
  margin:18px 0 10px;
  font-weight:600;
}

/* SECTION/BIN CARDS */
.zone-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:10px;
  cursor:pointer;
  transition:all 0.2s ease;
  position:relative;
  overflow:hidden;
}
.zone-card:active{transform:scale(0.98);background:var(--bg-card-hover)}
.zone-card.has-missing{
  background:linear-gradient(135deg,var(--danger-bg) 0%,transparent 80%);
  border-color:rgba(232,92,82,0.25);
}
.zone-card.complete{
  background:linear-gradient(135deg,var(--ok-bg) 0%,transparent 80%);
  border-color:rgba(126,201,126,0.18);
}
.zone-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.zone-info{flex:1;min-width:0}
.zone-title{font-weight:700;font-size:16px;letter-spacing:-0.01em}
.zone-title.vip::after{content:" ★";color:var(--accent)}
.zone-desc{font-size:12px;color:var(--text-3);margin-top:2px}
.zone-status{font-size:12px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px}
.zone-status.ok{color:var(--ok)}
.zone-status.warn{color:var(--danger)}
.zone-status.neutral{color:var(--text-2)}
.zone-arrow{
  color:var(--text-3);
  font-size:22px;
  flex-shrink:0;
}

/* SUMMARY CARD */
.summary-card{
  background:linear-gradient(135deg,rgba(200,150,87,0.08) 0%,rgba(200,150,87,0.02) 100%);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.summary-card:active{transform:scale(0.99)}
.summary-label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.15em;
  color:var(--accent);font-weight:700;
}
.summary-num{
  font-family:'Fraunces',serif;
  font-size:48px;line-height:1;
  font-weight:600;margin-top:10px;letter-spacing:-0.03em;
  color:var(--text);
}
.summary-num.zero{color:var(--ok)}
.summary-sub{font-size:13px;color:var(--text-2);margin-top:8px}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  padding:15px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);
  color:#1a0f02;
  border:none;border-radius:14px;
  font-family:inherit;font-weight:700;font-size:15px;
  cursor:pointer;
  letter-spacing:0.02em;
  box-shadow:0 4px 16px var(--accent-glow);
  transition:transform 0.15s ease;
}
.btn:active{transform:scale(0.98)}
.btn-secondary{
  background:var(--bg-card);
  color:var(--text);
  border:1px solid var(--border);
  box-shadow:none;
}
.btn-secondary:active{background:var(--bg-card-hover)}
.btn-danger{
  background:transparent;
  color:var(--danger);
  border:1px solid rgba(232,92,82,0.4);
  box-shadow:none;
}
.btn-danger:active{background:var(--danger-bg)}
.btn-icon{font-size:18px}
.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* BIG SCAN BUTTON (in zone screen) */
.btn-scan{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;
  padding:18px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);
  color:#1a0f02;
  border:none;border-radius:16px;
  font-family:inherit;font-weight:700;font-size:16px;
  cursor:pointer;
  letter-spacing:0.02em;
  box-shadow:0 8px 24px var(--accent-glow);
  margin-bottom:6px;
  transition:transform 0.15s ease;
}
.btn-scan:active{transform:scale(0.98)}
.scan-secondary{
  display:flex;gap:10px;margin-bottom:16px;
}
.scan-secondary .btn{
  padding:11px;
  font-size:13px;
}

/* BOTTOM TAB BAR */
.tabs{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,10,10,0.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  z-index:50;
  max-width:480px;margin:0 auto;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px;
  font-size:10px;font-weight:600;
  color:var(--text-3);
  background:none;border:none;cursor:pointer;
  font-family:inherit;
  text-transform:uppercase;letter-spacing:0.08em;
  transition:color 0.2s ease;
}
.tab.active{color:var(--accent)}
.tab-icon{font-size:22px}

/* SCREEN (overlay views) */
.screen{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:100;
  display:none;
  flex-direction:column;
  max-width:480px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.active{display:flex}
.screen-header{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}
.screen-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-0.01em;flex:1}
.screen-title.vip::after{content:" ★";color:var(--accent)}
.back-btn{
  background:var(--bg-card);border:1px solid var(--border);
  width:38px;height:38px;border-radius:50%;
  color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;
}
.back-btn:active{background:var(--bg-card-hover)}
.screen-body{flex:1;overflow-y:auto;padding:16px 18px 140px;-webkit-overflow-scrolling:touch}

/* PROVIDER BADGE */
.provider-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;
  padding:5px 10px;border-radius:100px;
  letter-spacing:0.1em;text-transform:uppercase;
  margin-bottom:14px;
}
.provider-badge.gemini{background:rgba(200,150,87,0.12);color:var(--accent)}
.provider-badge.roboflow{background:rgba(126,201,126,0.12);color:var(--ok)}

/* PHOTO PREVIEW */
.photo-preview{
  width:100%;
  aspect-ratio:4/3;
  background:var(--bg-card);
  border:1px dashed var(--border-strong);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:14px;
  overflow:hidden;
}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{text-align:center;padding:24px;color:var(--text-3)}
.photo-placeholder-icon{font-size:42px;margin-bottom:8px;opacity:0.5}
.photo-placeholder-text{font-size:13px}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 20px;text-align:center}
.spinner{
  width:42px;height:42px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-2);font-size:14px}

/* AI REASONING BOX */
.reasoning{
  background:rgba(200,150,87,0.06);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:14px;
}
.reasoning-label{
  font-size:10px;color:var(--accent);font-weight:700;
  text-transform:uppercase;letter-spacing:0.15em;
  margin-bottom:6px;
}
.reasoning-text{font-size:12px;color:var(--text-2);line-height:1.5}

/* COMPACT PRODUCT LINE (positions/produits dans une zone) */
.prod-line{
  display:flex;align-items:center;gap:12px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:7px;
  transition:all 0.2s ease;
  position:relative;
}
.prod-line.missing{
  background:linear-gradient(90deg,var(--danger-bg) 0%,var(--bg-card) 60%);
  border-color:rgba(232,92,82,0.25);
}
.prod-line.complete{
  background:linear-gradient(90deg,var(--ok-bg) 0%,var(--bg-card) 60%);
  border-color:rgba(126,201,126,0.18);
}
.prod-line.exception{border-left:3px solid var(--accent)}
.prod-info{flex:1;min-width:0}
.prod-num{
  font-size:10px;color:var(--text-3);font-weight:600;
  text-transform:uppercase;letter-spacing:0.1em;
  margin-bottom:2px;
}
.prod-name{font-weight:600;font-size:14px;line-height:1.25;letter-spacing:-0.01em}
.prod-name.exception-name{color:var(--accent-light)}
.prod-ratio{
  font-family:'Fraunces',serif;
  font-size:15px;font-weight:600;
  color:var(--text);
  min-width:42px;text-align:center;
  letter-spacing:-0.02em;
}
.prod-ratio.missing{color:var(--danger)}
.prod-ratio.complete{color:var(--ok)}
.qty-mini{
  display:flex;align-items:center;gap:4px;
  flex-shrink:0;
}
.qty-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--bg-3);border:1px solid var(--border);
  color:var(--text);font-size:18px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
  font-family:inherit;
  transition:all 0.15s ease;
}
.qty-btn:active{transform:scale(0.9);background:var(--border)}
.qty-btn.plus{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);color:#1a0f02;border-color:transparent}
.qty-btn.minus{background:var(--bg-3)}

/* AI NOTE */
.ai-note{
  font-size:11px;color:var(--text-3);
  margin-top:4px;font-style:italic;
  line-height:1.35;
}

/* RESTOCK LIST */
.restock-cat{
  margin-bottom:16px;
}
.restock-cat-header{
  font-family:'Fraunces',serif;
  font-size:12px;font-weight:600;
  letter-spacing:0.12em;text-transform:uppercase;
  color:var(--accent);
  margin-bottom:8px;
  padding:0 4px;
}
.restock-item{
  display:flex;align-items:center;gap:12px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  border-radius:12px;
  padding:12px 14px;
  margin-bottom:6px;
  transition:all 0.2s ease;
}
.restock-item.done{
  opacity:0.55;
  border-left-color:var(--ok);
}
.restock-item-main{flex:1;min-width:0}
.restock-item-name{font-weight:700;font-size:15px;letter-spacing:-0.01em}
.restock-item-packs{
  font-size:11px;color:var(--text-2);
  margin-top:3px;
}
.qty-pill{
  font-family:'Fraunces',serif;
  font-size:16px;font-weight:600;
  background:var(--danger-bg);
  color:var(--danger);
  border:1px solid rgba(232,92,82,0.25);
  border-radius:100px;
  padding:4px 12px;
  min-width:42px;text-align:center;
  letter-spacing:-0.02em;
}
.qty-pill.done{
  background:var(--ok-bg);color:var(--ok);
  border-color:rgba(126,201,126,0.25);
}
.btn-done{
  background:linear-gradient(135deg,#7ec97e 0%,#9eda9e 100%);
  color:#082e08;
  border:none;
  padding:8px 14px;
  border-radius:100px;
  font-family:inherit;font-weight:700;font-size:12px;
  cursor:pointer;
  display:flex;align-items:center;gap:5px;
  letter-spacing:0.04em;
  flex-shrink:0;
  transition:transform 0.15s ease;
}
.btn-done:active{transform:scale(0.95)}
.btn-done.undone{
  background:var(--bg-3);
  color:var(--text-2);
}

/* SETTINGS */
.setting-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 18px;
  margin-bottom:10px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.setting-card:active{background:var(--bg-card-hover)}
.setting-card.selected{
  background:linear-gradient(135deg,rgba(200,150,87,0.1) 0%,transparent 80%);
  border-color:rgba(200,150,87,0.35);
}
.setting-title{font-weight:700;font-size:15px;letter-spacing:-0.01em}
.setting-desc{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.4}
.setting-tag{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em;margin-top:4px}

.input{
  width:100%;
  padding:14px 16px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-family:inherit;font-size:15px;
  margin-bottom:10px;
}
.input:focus{outline:none;border-color:var(--accent)}

.help{
  font-size:12px;color:var(--text-3);line-height:1.5;
  background:rgba(200,150,87,0.04);
  border-left:3px solid var(--accent);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:12px;
}
.help strong{color:var(--accent)}
.help code{background:var(--bg-3);padding:1px 5px;border-radius:4px;font-family:'Courier',monospace;font-size:11px}

/* TOAST */
.toast{
  position:fixed;
  bottom:100px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--bg-3);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 18px;
  border-radius:30px;
  font-size:14px;font-weight:600;
  z-index:200;
  opacity:0;
  transition:all 0.3s ease;
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-icon{font-size:52px;opacity:0.4;margin-bottom:14px}
.empty-text{font-size:15px;line-height:1.5}
.empty-sub{font-size:12px;color:var(--text-3);margin-top:8px}

/* SETUP */
.setup-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  margin-bottom:18px;
}
.setup-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:-0.02em}
.setup-sub{color:var(--text-2);font-size:13px;margin-bottom:18px;line-height:1.5}

</style>
</head>
<body>
<div class="app">

<!-- ============================================ -->
<!-- TAB CONTENT 1: SCANNER -->
<!-- ============================================ -->
<div id="tab-scanner-content" class="tab-content">
  <div class="header">
    <h1>Réassort<span>.</span></h1>
    <span class="badge" id="header-badge">0</span>
  </div>

  <!-- Setup screen if no API key -->
  <div id="setup-screen" style="display:none;padding:0 18px">
    <div class="setup-card">
      <div class="setup-title">Configuration</div>
      <div class="setup-sub">Colle ta clé API Gemini (gratuite). Elle reste sur ton téléphone.</div>
      <input type="password" id="api-key-input" class="input" placeholder="AIzaSy...">
      <button class="btn" onclick="saveApiKey()">Valider</button>
      <div class="help" style="margin-top:14px">
        1. Va sur <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent)">aistudio.google.com/apikey</a><br>
        2. "Create API key" → "new project"<br>
        3. Copie-colle la clé ici
      </div>
    </div>
  </div>

  <div id="scanner-main" style="display:none">
    <!-- Toggle Comptoir / Bacs -->
    <div class="toggle-group">
      <button class="toggle-btn active" id="zone-toggle-counter" onclick="setZone('counter')">
        Comptoir
      </button>
      <button class="toggle-btn" id="zone-toggle-bins" onclick="setZone('bins')">
        Bacs blancs
      </button>
    </div>

    <div class="content">
      <div id="zones-list"></div>
    </div>
  </div>
</div>

<!-- ============================================ -->
<!-- TAB CONTENT 2: RESTOCK -->
<!-- ============================================ -->
<div id="tab-restock-content" class="tab-content" style="display:none">
  <div class="header">
    <h1>À <span>Remonter</span></h1>
  </div>
  <div class="content">
    <div id="restock-summary-block"></div>
    <div id="restock-content"></div>
  </div>
</div>

<!-- ============================================ -->
<!-- TAB CONTENT 3: SETTINGS -->
<!-- ============================================ -->
<div id="tab-settings-content" class="tab-content" style="display:none">
  <div class="header">
    <h1>Réglages</h1>
  </div>
  <div class="content">
    <div id="settings-content"></div>
  </div>
</div>


<!-- ============================================ -->
<!-- ZONE SCREEN (overlay) -->
<!-- ============================================ -->
<div id="zone-screen" class="screen">
  <div class="screen-header">
    <button class="back-btn" onclick="closeZone()">←</button>
    <div class="screen-title" id="zone-screen-title">Zone</div>
  </div>
  <div class="screen-body" id="zone-screen-body"></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" id="tab-scanner" onclick="showTab('scanner')">
    <div class="tab-icon">📷</div>
    Scanner
  </button>
  <button class="tab" id="tab-restock" onclick="showTab('restock')">
    <div class="tab-icon">📋</div>

function formatPacks(qty){
  const packs = Math.floor(qty / PACK_SIZE);
  const units = qty % PACK_SIZE;
  if(qty === 0) return '';
  if(packs === 0) return `${units} unité${units>1?'s':''}`;
  if(units === 0) return `${packs} pack${packs>1?'s':''} de ${PACK_SIZE}`;
  return `${packs} pack${packs>1?'s':''} + ${units} unité${units>1?'s':''}`;
}

function adjustQty(idx, delta){
  const r = currentResults[idx];
  const target = r.isBin ? r.min : 3;
  const maxAllowed = target * 2 + 2;
  r.detected = Math.max(0, Math.min(maxAllowed, r.detected + delta));
  r.missing = Math.max(0, target - r.detected);
  renderZoneScreen();
}

function onPhotoSelected(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 1280;
      let w = img.width, h = img.height;
      if(w > MAX || h > MAX){
        if(w > h){ h = h * (MAX/w); w = MAX; }
        else { w = w * (MAX/h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      currentPhoto = canvas.toDataURL('image/jpeg', 0.75);
      analyzePhoto();
    };
    img.onerror = ()=>toast('Erreur lecture image');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function geminiRequest(model, body){
  const MAX_ATTEMPTS = 3;
  const DELAYS = [1500, 3500, 7000];
  for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${state.apiKey}`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      if(r.ok) return await r.json();
      const errText = await r.text();
      const retriable = r.status===503||r.status===429||r.status>=500;
      if(!retriable || attempt===MAX_ATTEMPTS) throw new Error(`API ${r.status}: ${errText.substring(0,150)}`);
      const el = document.querySelector('.loading-text');
      if(el) el.innerHTML = `Service occupé, tentative ${attempt+1}/${MAX_ATTEMPTS}...`;
      await new Promise(res=>setTimeout(res, DELAYS[attempt-1]));
    } catch(e){
      if(attempt===MAX_ATTEMPTS) throw e;
      await new Promise(res=>setTimeout(res, DELAYS[attempt-1]));
    }
  }
}

function buildLearningsBlock(zoneType){
  const lessons = state.learnings[zoneType] || [];
  if(lessons.length === 0) return '';
  const byProduct = {};
  lessons.forEach(l=>{
    if(!byProduct[l.productName]) byProduct[l.productName] = [];
    byProduct[l.productName].push(l.delta);
  });
  const insights = [];
  Object.entries(byProduct).forEach(([name, deltas])=>{
    if(deltas.length < 2) return;
    const avg = deltas.reduce((s,d)=>s+d,0)/deltas.length;
    if(Math.abs(avg) < 0.5) return;
    if(avg < 0) insights.push(`- "${name}": tendance à SUR-COMPTER (+${Math.abs(avg).toFixed(1)} en trop). Sois plus conservateur.`);
    else insights.push(`- "${name}": tendance à SOUS-COMPTER (${avg.toFixed(1)} oubliées). Compte aussi les bouteilles partiellement cachées.`);
  });
  if(insights.length === 0) return '';
  return `\n\nLEÇONS APPRISES SUR CE BAR:\n${insights.join('\n')}\n\nTiens compte de ces patterns.`;
}

    return `Position ${p.n}: "${p.name}" (3 bouteilles identiques attendues)`;
  }).join('\n');

  const prompt = isVip ? `
Tu analyses une photo du comptoir VIP d'un bar. Chaque position contient une ou plusieurs bouteilles d'un produit spécifique.${learnings}

POSITIONS À ANALYSER:
${posDesc}

Pour chaque position, compte le nombre de bouteilles VISIBLES du produit attendu.

Réponds UNIQUEMENT en JSON valide:
{"positions":[{"n":78,"detected":3,"confidence":"high"},...]}
` : `
Tu analyses une photo du comptoir d'un bar. Chaque "position" est une COLONNE de 3 bouteilles alignées en PROFONDEUR. Quand une bouteille manque, il y a un TROU visible (moins de bouchons au-dessus).${learnings}

POSITIONS À ANALYSER:
${posDesc}

Compte le nombre de bouchons/capsules visibles AU-DESSUS de la ligne. 3 = plein. 2 = manque 1. 1 = manque 2. 0 = vide.

Réponds UNIQUEMENT en JSON valide:
{"positions":[{"n":1,"detected":3,"confidence":"high"},{"n":4,"detected":3,"confidence":"medium","exception_detail":{"Cointreau":1,"Kahlua":2}},...]}
`;

  try {

    const mimeType = currentPhoto.match(/data:(.*?);/)[1];
    const data = await geminiRequest('gemini-2.5-flash', {

    });

function applyCounterDetection(detected){
  const detMap = {};
  (detected||[]).forEach(d=>{detMap[d.n] = d;});
  currentResults.forEach(r=>{
    const d = detMap[r.n];
    if(d){
      r.detected = d.detected ?? 3;
      r.aiOriginalDetected = r.detected;
      r.missing = Math.max(0, 3 - r.detected);
      r.confidence = d.confidence || 'medium';
      if(d.exception_detail) r.exception_detail = d.exception_detail;
    }
  });
}

async function analyzeBinRoboflow(){
  showLoading('Analyse via ton modèle Roboflow... (2-5s)');
  try {
    const base64 = currentPhoto.split(',')[1];
    const url = `https://detect.roboflow.com/${ROBOFLOW_CONFIG.project}/${ROBOFLOW_CONFIG.version}?api_key=${state.roboflowKey}&confidence=30&overlap=50`;
    const r = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: base64
    });
    if(!r.ok){
      const err = await r.text();
      throw new Error(`Roboflow ${r.status}: ${err.substring(0,150)}`);
    }
    const data = await r.json();
    const counts = {};
    (data.predictions||[]).forEach(p=>{
      const name = ROBOFLOW_CLASS_MAP[p.class] || p.class;
      counts[name] = (counts[name]||0)+1;
    });
    const products = BIN_PRODUCTS.map(p=>({
      name:p.name,
      detected: counts[p.name]||0,
      confidence:'high',
      note: `${counts[p.name]||0} détection(s) — modèle Roboflow`,
    }));
    applyBinDetection(products);
    currentReasoning = `Modèle Roboflow v${ROBOFLOW_CONFIG.version} — ${data.predictions?.length||0} bouteille(s) détectée(s).`;
    renderZoneScreen();
  } catch(e){
    console.error(e);
    showError(e.message);
  }
}

function applyBinDetection(detected){
  const detMap = {};
  detected.forEach(d=>{detMap[d.name]=d;});
  currentResults.forEach(r=>{
    const d = detMap[r.name];
    if(d){
      r.detected = d.detected ?? r.min;
      r.aiOriginalDetected = r.detected;
      r.missing = Math.max(0, r.min - r.detected);
      r.confidence = d.confidence || 'medium';
      r.aiNote = d.note || '';
    }
  });
}

// CONFIRM VALIDATION
// ============================================================
async function confirmValidation(){
  const zoneType = currentSection.isBin ? 'bin' : 'counter';
  const now = Date.now();

  // Capture learnings (silent background)
  currentResults.forEach(r=>{
    if(r.aiOriginalDetected !== undefined && r.confidence !== 'manual'){
      const delta = r.detected - r.aiOriginalDetected;
      if(delta !== 0){
        state.learnings[zoneType].push({
          type:'auto',
          productName:r.name,
          aiSaid:r.aiOriginalDetected,
          actualWas:r.detected,
          delta:delta,
          timestamp:now,
        });
      }
    }
  });
  if(state.learnings[zoneType].length > 100){
    state.learnings[zoneType] = state.learnings[zoneType].slice(-100);
  }

  // Remove previous scan's missing items
  const oldScan = state.scans[currentSection.id];
  if(oldScan && oldScan.results){
    oldScan.results.forEach(r=>{
      if(r.missing > 0){
        if(r.exception && r.items){
          const detail = r.exception_detail || {};
          const itemCounts = {};
          r.items.forEach(it=>{itemCounts[it]=(itemCounts[it]||0)+1;});
          Object.keys(itemCounts).forEach(item=>{
            const expected = itemCounts[item];
            const detected = detail[item] !== undefined ? detail[item] : expected;
            const wasMissing = Math.max(0, expected - detected);
            if(wasMissing > 0 && state.restock[item]){
              state.restock[item] = Math.max(0, state.restock[item] - wasMissing);
            }
          });
        } else if(state.restock[r.name]){
          state.restock[r.name] = Math.max(0, state.restock[r.name] - r.missing);
        }
      }
    });
  }

  // Add new missing items
  currentResults.forEach(r=>{
    if(r.missing > 0){
      if(r.exception && r.items){
        const detail = r.exception_detail || {};
        const itemCounts = {};
        r.items.forEach(it=>{itemCounts[it]=(itemCounts[it]||0)+1;});
        Object.keys(itemCounts).forEach(item=>{
          const expected = itemCounts[item];
          const detected = detail[item] !== undefined ? detail[item] : expected;
          const missing = Math.max(0, expected - detected);
          if(missing > 0) state.restock[item] = (state.restock[item]||0) + missing;
        });
      } else {
        state.restock[r.name] = (state.restock[r.name]||0) + r.missing;
      }
    }
  });

  // Clean
  Object.keys(state.restock).forEach(k=>{
    if(state.restock[k] === 0) delete state.restock[k];
  });

  // Save scan
  const ts = new Date().toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const totalMissing = currentResults.reduce((s,r)=>s+r.missing,0);
  state.scans[currentSection.id] = {
    timestamp: ts,
    missing: totalMissing,
    results: currentResults,
  };

  saveState();
  toast('Validé ✓');
  closeZone();
}

// RESTOCK TAB
// ============================================================
function renderRestock(){
  const items = Object.entries(state.restock).filter(([k,v])=>v>0);
  const summaryBlock = document.getElementById('restock-summary-block');
  const container = document.getElementById('restock-content');

  // Update header badge
  const activeUnits = items.filter(([k])=>!state.done[k]).reduce((s,[k,v])=>s+v,0);
  document.getElementById('header-badge').textContent = activeUnits;

  if(items.length === 0){
    summaryBlock.innerHTML = '';
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎉</div>
        <div class="empty-text">Rien à remonter !</div>
        <div class="empty-sub">Les manquants apparaîtront ici après tes scans.</div>
      </div>
    `;
    return;
  }

  const totalActiveUnits = items.filter(([k])=>!state.done[k]).reduce((s,[k,v])=>s+v,0);
  const totalDoneUnits = items.filter(([k])=>state.done[k]).reduce((s,[k,v])=>s+v,0);

  summaryBlock.innerHTML = `
    <div class="summary-card">
      <div class="summary-label">À Remonter</div>
      <div class="summary-num ${totalActiveUnits===0?'zero':''}">${totalActiveUnits}</div>
      <div class="summary-sub">${items.length} produit${items.length>1?'s':''} • ${totalDoneUnits} déjà fait${totalDoneUnits>1?'s':''}</div>
    </div>
    <div class="btn-stack" style="margin-top:0;margin-bottom:18px">
      <button class="btn btn-secondary" onclick="copyList()">📋 Copier la liste</button>
      <button class="btn btn-danger" onclick="resetRestock()">Vider la liste</button>
    </div>
  `;

  // Group by category
  const byCategory = {};
  items.forEach(([name, qty])=>{
    const pos = POSITIONS.find(p=>p.name === name || (p.items && p.items.includes(name)));
    const bin = BIN_PRODUCTS.find(p=>p.name === name);
    const cat = pos ? pos.cat.replace(' VIP','') : (bin ? bin.cat : 'Autres');
    if(!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push({name, qty});
  });

  container.innerHTML = Object.entries(byCategory).map(([cat, products])=>`
    <div class="restock-cat">
      <div class="restock-cat-header">${cat}</div>
      ${products.map(p=>{
        const done = !!state.done[p.name];
        const packsStr = formatPacks(p.qty);
        return `
          <div class="restock-item ${done?'done':''}">
            <div class="restock-item-main">
              <div class="restock-item-name">${escapeHtml(p.name)}</div>
              ${packsStr ? `<div class="restock-item-packs">${packsStr}</div>` : ''}
            </div>
            <div class="qty-pill ${done?'done':''}">${p.qty}</div>
            <div class="qty-mini">
              <button class="qty-btn minus" onclick="restockAdjust('${p.name.replace(/'/g,"\\'")}',-1)">−</button>
              <button class="qty-btn plus" onclick="restockAdjust('${p.name.replace(/'/g,"\\'")}',1)">+</button>
            </div>
            <button class="btn-done ${done?'undone':''}" onclick="toggleDone('${p.name.replace(/'/g,"\\'")}')">
              ${done ? '↺' : '✓'}
            </button>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');
}

function restockAdjust(name, delta){
  state.restock[name] = (state.restock[name]||0) + delta;
  if(state.restock[name] <= 0){
    delete state.restock[name];
    delete state.done[name];
  }
  saveState();
  renderRestock();
}

function toggleDone(name){
  if(state.done[name]) delete state.done[name];
  else state.done[name] = true;
  saveState();
  renderRestock();
}

function copyList(){
  const items = Object.entries(state.restock).filter(([k,v])=>v>0);
  const text = items.map(([name,qty])=>{
    const packsStr = formatPacks(qty);
    return `${qty}× ${name}${packsStr ? ' ('+packsStr+')' : ''}`;
  }).join('\n');
  navigator.clipboard.writeText(text).then(()=>toast('Liste copiée ✓'));
}

function resetRestock(){
  if(!confirm('Vider toute la liste de réassort ?')) return;
  state.restock = {};
  state.done = {};
  state.scans = {};
  saveState();
  renderRestock();
  toast('Liste vidée');
}

function setProvider(p){
  state.binProvider = p;
  saveState();
  toast(p === 'roboflow' ? 'Mode Roboflow activé ✓' : 'Mode Gemini activé ✓');
  renderSettings();
}

function tryRoboflowMode(){
  if(!state.roboflowKey){
    toast('Configure d\'abord ta clé Roboflow');
    return;
  }
  setProvider('roboflow');
}

function saveRoboflowKey(){
  const v = document.getElementById('roboflow-key-input').value.trim();
  if(!v){
    toast('Colle ta clé d\'abord');
    return;
  }
  localStorage.setItem('roboflow_key', v);
  state.roboflowKey = v;
  if(state.binProvider !== 'roboflow'){
    state.binProvider = 'roboflow';
    saveState();
  }
  toast('Clé Roboflow enregistrée ✓');
  renderSettings();
}

function removeRoboflowKey(){
  if(!confirm('Supprimer la clé Roboflow ?')) return;
  localStorage.removeItem('roboflow_key');
  state.roboflowKey = '';
  state.binProvider = 'gemini';
  saveState();
  toast('Clé supprimée');
  renderSettings();
}

function resetGeminiKey(){
  if(!confirm('Vider la clé Gemini ?')) return;
  localStorage.removeItem('gemini_key');
  state.apiKey = '';
  toast('Clé Gemini supprimée');
  showTab('scanner');
}

function resetLearnings(){
  if(!confirm('Effacer toutes les leçons apprises ?')) return;
  state.learnings = {counter:[], bin:[]};
  saveState();
  toast('Leçons réinitialisées');
  renderSettings();
}

function saveApiKey(){
  const v = document.getElementById('api-key-input').value.trim();
  if(!v.startsWith('AIza')){
    toast('Clé invalide (doit commencer par AIza)');
    return;
  }
  localStorage.setItem('gemini_key', v);
  state.apiKey = v;
  toast('Clé enregistrée ✓');
  renderScanner();
}
