<meta name="theme-color" content="#0a0a0a">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;
  --bg-2:#141414;
  --bg-3:#1c1c1c;
  --border:#2a2a2a;
  --text:#f5f0e6;
  --text-2:#a0958a;
  --text-3:#666058;
  --accent:#c89657;
  --accent-2:#e8b974;
  --danger:#e85c52;
  --warn:#e8b974;
  --ok:#7ec97e;
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:'Manrope',-apple-system,system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.4;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.app{min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

/* HEADER */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;top:0;z-index:10;
}
.header h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:-0.02em;
}
.header h1 span{color:var(--accent)}
.badge{
  background:var(--accent);color:#000;
  font-weight:700;font-size:11px;
  padding:3px 8px;border-radius:100px;
  letter-spacing:0.04em;
}

/* CONTENT */
.content{flex:1;padding:18px;padding-bottom:120px}

.section-title{
  font-family:'Fraunces',serif;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:0.15em;
  color:var(--text-3);
  margin:24px 0 12px;
  font-weight:600;
}
.section-title:first-child{margin-top:0}

/* CARDS */
.card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:10px;
  cursor:pointer;
  transition:all 0.2s ease;
}
.card:active{transform:scale(0.98);background:var(--bg-3)}
.card-row{display:flex;align-items:center;justify-content:space-between}
.card-title{font-weight:600;font-size:16px;letter-spacing:-0.01em}
.card-sub{font-size:13px;color:var(--text-2);margin-top:3px}
.card-arrow{color:var(--text-3);font-size:20px}

.scan-card{
  background:linear-gradient(135deg,#1c1410 0%,#0a0a0a 100%);
  border:1px solid var(--border);
}
.scan-card.done{
  border-color:var(--ok);
  opacity:0.75;
}
.scan-card.partial{border-color:var(--accent)}

/* RESTOCK LIST */
.restock-summary{
  background:linear-gradient(135deg,#1a1410 0%,#0f0c08 100%);
  border:1px solid var(--accent);
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}
.restock-summary-label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.15em;
  color:var(--accent);font-weight:600;
}
.restock-summary-num{
  font-family:'Fraunces',serif;
  font-size:42px;line-height:1;
  font-weight:600;margin-top:8px;letter-spacing:-0.03em;
}
.restock-summary-sub{font-size:13px;color:var(--text-2);margin-top:6px}

.restock-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:8px;
}
.restock-item-name{font-weight:600;font-size:15px}
.restock-item-detail{font-size:12px;color:var(--text-3);margin-top:2px}
.qty-controls{display:flex;align-items:center;gap:10px}
.qty-btn{
  width:34px;height:34px;border-radius:50%;
  background:var(--bg-3);border:1px solid var(--border);
  color:var(--text);font-size:18px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.qty-btn:active{background:var(--border)}
.qty-num{font-weight:700;font-size:18px;min-width:24px;text-align:center;font-family:'Fraunces',serif}

/* BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  padding:16px;
  background:var(--accent);
  color:#000;
  border:none;border-radius:12px;
  font-family:inherit;font-weight:700;font-size:15px;
  cursor:pointer;
  letter-spacing:0.02em;
}
.btn:active{background:var(--accent-2)}
.btn-secondary{background:var(--bg-3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:active{background:var(--border)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-icon{font-size:18px}

.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}

/* BOTTOM TAB BAR */
.tabs{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  z-index:50;
  max-width:480px;margin:0 auto;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px;
  font-size:11px;font-weight:600;
  color:var(--text-3);
  background:none;border:none;cursor:pointer;
  font-family:inherit;
  text-transform:uppercase;letter-spacing:0.08em;
}
.tab.active{color:var(--accent)}
.tab-icon{font-size:22px}

/* MODAL / SCREEN */
.screen{
  position:fixed;inset:0;
  background:var(--bg);
  z-index:100;
  display:none;
  flex-direction:column;
  max-width:480px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen.active{display:flex}
.screen-header{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
}
.screen-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;letter-spacing:-0.01em;flex:1}
.back-btn{
  background:var(--bg-2);border:1px solid var(--border);
  width:36px;height:36px;border-radius:50%;
  color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.screen-body{flex:1;overflow-y:auto;padding:18px;padding-bottom:120px}

/* PHOTO CAPTURE */
.photo-preview{
  width:100%;
  aspect-ratio:3/4;
  background:var(--bg-2);
  border:2px dashed var(--border);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
  overflow:hidden;
  position:relative;
}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{text-align:center;padding:30px;color:var(--text-2)}
.photo-placeholder-icon{font-size:60px;margin-bottom:10px;opacity:0.4}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 20px;text-align:center}
.spinner{
  width:42px;height:42px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-2);font-size:14px}

/* POSITION ITEM (validation) */
.position-item{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:8px;
}
.position-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.position-info{flex:1;min-width:0}
.position-num{
  font-size:11px;color:var(--text-3);font-weight:600;
  text-transform:uppercase;letter-spacing:0.1em;
}
.position-name{font-weight:600;font-size:14px;margin-top:2px;letter-spacing:-0.01em}
.position-name.exception{color:var(--accent)}
.position-status{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;
}
.dot{width:8px;height:8px;border-radius:50%}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--danger)}

/* SETUP / API KEY */
.setup-card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
}
.setup-title{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-bottom:6px;letter-spacing:-0.02em}
.setup-sub{color:var(--text-2);font-size:14px;margin-bottom:18px;line-height:1.5}
.input{
  width:100%;
  padding:14px 16px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-family:inherit;font-size:15px;
  margin-bottom:12px;
}
.input:focus{outline:none;border-color:var(--accent)}
.help{font-size:12px;color:var(--text-3);line-height:1.5;margin-top:10px}
.help a{color:var(--accent);text-decoration:none}

/* TOAST */
.toast{
  position:fixed;
  bottom:100px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--bg-3);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 18px;
  border-radius:30px;
  font-size:14px;font-weight:600;
  z-index:200;
  opacity:0;
  transition:all 0.3s ease;
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text-2)}
.empty-icon{font-size:48px;opacity:0.3;margin-bottom:12px}
.empty-text{font-size:15px}

/* CATEGORY group */
.cat-group{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}
.cat-header{
  padding:12px 16px;
  font-family:'Fraunces',serif;
  font-size:13px;font-weight:600;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--accent);
  background:rgba(200,150,87,0.05);
  border-bottom:1px solid var(--border);
}
.cat-items{padding:8px}
.cat-items .restock-item{background:transparent;border:none;border-radius:8px;padding:10px 8px;margin-bottom:0}

.exception-hint{
  background:rgba(200,150,87,0.1);
  border:1px solid var(--accent);
  color:var(--accent-2);
  padding:10px 12px;
  border-radius:10px;
  font-size:12px;
  margin-top:10px;
  line-height:1.4;
}
</style>
</head>

async function analyzePhoto(){
  if(!currentPhoto) return;
  const positions = POSITIONS.filter(p=>p.n>=currentSection.range[0] && p.n<=currentSection.range[1]);

  document.getElementById('section-content').innerHTML = `

    </div>
  `;

  const isVip = currentSection.isVip;

  const positionsDescription = positions.map(p=>{
    if(p.exception){
      return `Position ${p.n} (EXCEPTION): 3 bouteilles DIFFÉRENTES en profondeur = ${p.items.join(' + ')}. Compter chaque produit séparément.`;
    }
    return `Position ${p.n}: "${p.name}" (3 bouteilles identiques en profondeur attendues)`;
  }).join('\n');

  const prompt = isVip ? `
Tu analyses une photo du comptoir VIP d'un bar. C'est une zone de stockage où chaque position contient une ou plusieurs bouteilles d'un produit spécifique.

POSITIONS À ANALYSER (de gauche à droite):
${positionsDescription}

Pour chaque position, compte le nombre de bouteilles VISIBLES du produit attendu.

Réponds UNIQUEMENT en JSON valide, sans markdown, sans backticks, format exact:
{
  "positions": [
    {"n": 78, "detected": 3, "expected": 3, "confidence": "high"},
    ...
  ]
}

Sois précis. Si tu ne peux pas voir une position clairement, mets "confidence": "low".
` : `
Tu analyses une photo du comptoir d'un bar. Chaque "position" est une COLONNE de 3 bouteilles alignées en PROFONDEUR (la 1ère devant avec un bec verseur, 2 derrière). Quand une bouteille est manquante, il y a un TROU visible (moins de bouchons visibles au-dessus).

POSITIONS À ANALYSER (de gauche à droite):
${positionsDescription}

MÉTHODE: Pour chaque position, compte le nombre de bouchons/capsules visibles AU-DESSUS de la ligne des bouteilles. Chaque produit a une couleur de bouchon caractéristique. 3 bouchons visibles = position pleine. 2 = il manque 1 bouteille. 1 = il manque 2. 0 = vide.

Pour les positions EXCEPTION: compte chaque produit attendu séparément.

Réponds UNIQUEMENT en JSON valide, sans markdown, sans backticks, format exact:
{
  "positions": [
    {"n": 1, "detected": 3, "expected": 3, "confidence": "high"},
    {"n": 4, "detected": 3, "expected": 3, "confidence": "medium", "exception_detail": {"Cointreau": 1, "Kahlua": 2}},
    ...
  ]
}

Sois précis et conservateur. Si tu ne peux pas voir clairement, mets "confidence": "low" et estime au mieux.
`;

let currentResults = null;

function renderValidation(detected, positions){
  // Map detected by position number
  const detMap = {};
  detected.forEach(d=>{ detMap[d.n] = d; });

  // Init results with detected values
  currentResults = positions.map(p=>{
    const d = detMap[p.n] || {detected: 3, confidence: 'low'};
    const expected = 3;
    const missing = Math.max(0, expected - (d.detected ?? 3));
    return {
      n: p.n,
      name: p.name,
      cat: p.cat,
      exception: p.exception,
      items: p.items,
      detected: d.detected ?? 3,
      missing: missing,
      confidence: d.confidence || 'medium',
      exception_detail: d.exception_detail,
    };
  });

  renderValidationUI();
}

function renderValidationUI(){
  const totalMissing = currentResults.reduce((s,r)=>s+r.missing, 0);

  document.getElementById('section-content').innerHTML = `
    <div class="restock-summary">
      <div class="restock-summary-label">Détecté par l'IA</div>
      <div class="restock-summary-num">${totalMissing}</div>
      <div class="restock-summary-sub">bouteille${totalMissing>1?'s':''} manquante${totalMissing>1?'s':''} sur cette section</div>
    </div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:14px;line-height:1.5">
      Vérifie chaque position. Ajuste les manquants si l'IA s'est trompée, puis valide.
    </div>
    <div id="validation-list">
      ${currentResults.map((r, i)=>renderValidationItem(r, i)).join('')}
    </div>
    <div class="btn-stack">
      <button class="btn" onclick="confirmValidation()">
        ✓ Valider et ajouter au réassort
      </button>
      <button class="btn btn-secondary" onclick="${currentSection.isBin ? 'renderBinInit()' : 'renderSectionInit()'}">
        Reprendre une photo
      </button>
    </div>
  `;
}

function renderValidationItem(r, i){
  let dotClass = 'ok';
  if(r.missing === 0) dotClass = 'ok';
  else if(r.missing < (r.isBin ? r.min : 3)) dotClass = 'warn';
  else dotClass = 'bad';

  const confLabel = r.confidence === 'high' ? '' : r.confidence === 'medium' ? ' • IA: moyenne' : r.confidence === 'manual' ? ' • Manuel' : ' • IA: incertain';

  if(r.isBin){
    return `
      <div class="position-item">
        <div class="position-row">
          <div class="position-info">
            <div class="position-num">${r.cat} • min ${r.min}${confLabel}</div>
            <div class="position-name">${r.name}</div>
          </div>
          <div class="position-status">
            <div class="dot ${dotClass}"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          <div>
            <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em">Manque</div>
            <div style="font-size:13px;color:var(--text-2);margin-top:2px">Détecté: ${r.detected}/${r.min}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="adjustQty(${i},-1)">−</button>
            <div class="qty-num">${r.missing}</div>
            <button class="qty-btn" onclick="adjustQty(${i},1)">+</button>
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="position-item">
      <div class="position-row">
        <div class="position-info">
          <div class="position-num">Position ${r.n} • ${r.cat}${confLabel}</div>
          <div class="position-name ${r.exception?'exception':''}">${r.name}</div>
          ${r.exception_detail ? `<div style="font-size:11px;color:var(--text-3);margin-top:4px">IA: ${Object.entries(r.exception_detail).map(([k,v])=>`${k}=${v}`).join(', ')}</div>` : ''}
        </div>
        <div class="position-status">
          <div class="dot ${dotClass}"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div>
          <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.1em">Manque</div>
          <div style="font-size:13px;color:var(--text-2);margin-top:2px">Présent: ${r.detected}/3</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="adjustQty(${i},-1)">−</button>
          <div class="qty-num">${r.missing}</div>
          <button class="qty-btn" onclick="adjustQty(${i},1)">+</button>
        </div>
      </div>
    </div>
  `;
}

function adjustQty(idx, delta){
  const r = currentResults[idx];
  const maxMissing = r.isBin ? r.min : 3;
  r.missing = Math.max(0, Math.min(maxMissing, r.missing + delta));
  r.detected = (r.isBin ? r.min : 3) - r.missing;
  renderValidationUI();
}

function confirmValidation(){
  // First, remove previous scan for this section
  const oldScan = state.scans[currentSection.id];
  if(oldScan && oldScan.results){
    oldScan.results.forEach(r=>{
      if(r.missing > 0){
        if(r.isBin){
          // Bin item
          if(state.restock[r.name]) state.restock[r.name] = Math.max(0, state.restock[r.name] - r.missing);
        } else if(r.exception){
          // Exception: decrement based on stored exception_detail or items
          const detail = r.exception_detail || {};
          const itemCounts = {};
          (r.items || []).forEach(it=>{ itemCounts[it] = (itemCounts[it]||0) + 1; });
          Object.keys(itemCounts).forEach(item=>{
            const expected = itemCounts[item];
            const detected = detail[item] !== undefined ? detail[item] : expected;
            const wasMissing = Math.max(0, expected - detected);
            if(wasMissing > 0 && state.restock[item]){
              state.restock[item] = Math.max(0, state.restock[item] - wasMissing);
            }
          });
        } else {
          if(state.restock[r.name]) state.restock[r.name] = Math.max(0, state.restock[r.name] - r.missing);
        }
      }
    });
  }

  // Add new missing items
  currentResults.forEach(r=>{
    if(r.missing > 0){
      if(r.isBin){
        state.restock[r.name] = (state.restock[r.name] || 0) + r.missing;
      } else if(r.exception){
        const detail = r.exception_detail || {};
        const itemCounts = {};
        r.items.forEach(it=>{ itemCounts[it] = (itemCounts[it]||0) + 1; });
        Object.keys(itemCounts).forEach(item=>{
          const expected = itemCounts[item];
          const detected = detail[item] !== undefined ? detail[item] : expected;
          const missing = Math.max(0, expected - detected);
          if(missing > 0){
            state.restock[item] = (state.restock[item] || 0) + missing;
          }
        });
      } else {
        state.restock[r.name] = (state.restock[r.name] || 0) + r.missing;
      }
    }
  });

  // Clean zeros
  Object.keys(state.restock).forEach(k=>{
    if(state.restock[k] === 0) delete state.restock[k];
  });

  // Save scan record
  const now = new Date();
  const ts = now.toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  const totalMissing = currentResults.reduce((s,r)=>s+r.missing, 0);
  state.scans[currentSection.id] = {
    timestamp: ts,
    missing: totalMissing,
    results: currentResults,
  };

  saveState();
  toast('Réassort mis à jour ✓');
  goHome();
}

function manualEntry(){
  if(currentSection.isBin){
    currentResults = BIN_PRODUCTS.map(p=>({
      name: p.name,
      cat: p.cat,
      min: p.min,
      detected: p.min,
      missing: 0,
      confidence: 'manual',
      isBin: true,
    }));
  } else {
    const positions = POSITIONS.filter(p=>p.n>=currentSection.range[0] && p.n<=currentSection.range[1]);
    currentResults = positions.map(p=>({
      n: p.n,
      name: p.name,
      cat: p.cat,
      exception: p.exception,
      items: p.items,
      detected: 3,
      missing: 0,
      confidence: 'manual',
    }));
  }
  renderValidationUI();
}

  try {
    const base64 = currentPhoto.split(',')[1];
    const mimeType = currentPhoto.match(/data:(.*?);/)[1];

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{
          parts: [
            {text: prompt},
            {inline_data: {mime_type: mimeType, data: base64}}
          ]
        }],
        generationConfig: {
          temperature: 0.1,
          responseMimeType: "application/json"
        }
      })
    });

    if(!response.ok){
      const err = await response.text();
      throw new Error(`API error: ${response.status} - ${err.substring(0,200)}`);
    }

    const data = await response.json();
    const text = data.candidates[0].content.parts[0].text;
    const parsed = JSON.parse(text);

    renderBinValidation(parsed.products);

  } catch(e){
    console.error(e);
    document.getElementById('section-content').innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">Erreur d'analyse:<br><span style="color:var(--danger);font-size:12px">${e.message}</span></div>
        <div class="btn-stack" style="max-width:300px;margin:20px auto">
          <button class="btn" onclick="renderBinInit()">Réessayer</button>
          <button class="btn btn-secondary" onclick="manualEntry()">Saisir manuellement</button>
        </div>
      </div>
    `;
  }
}

function renderBinValidation(detected){
  // Map by product name
  const detMap = {};
  detected.forEach(d=>{ detMap[d.name] = d; });

  currentResults = BIN_PRODUCTS.map(p=>{
    const d = detMap[p.name] || {detected: p.min, confidence: 'low'};
    const detectedCount = d.detected ?? p.min;
    const missing = Math.max(0, p.min - detectedCount);
    return {
      name: p.name,
      cat: p.cat,
      min: p.min,
      detected: detectedCount,
      missing: missing,
      confidence: d.confidence || 'medium',
      isBin: true,
    };
  });

  renderValidationUI();
}

// ============================================================
// RESTOCK RENDER
// ============================================================
function renderRestock(){
  const container = document.getElementById('restock-content');
  const items = Object.entries(state.restock).filter(([k,v])=>v>0);

  if(items.length === 0){
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">✨</div>
        <div class="empty-text">Aucun manque détecté.<br>Bar fully stocked.</div>
      </div>
    `;
    return;
  }

  // Group by category
  const byCategory = {};
  items.forEach(([name, qty])=>{
    // Find category from POSITIONS or BIN_PRODUCTS
    const pos = POSITIONS.find(p=>p.name === name || (p.items && p.items.includes(name)));
    const bin = BIN_PRODUCTS.find(p=>p.name === name);
    const cat = pos ? pos.cat.replace(' VIP','') : (bin ? bin.cat : 'Autres');
    if(!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push({name, qty});
  });

  const totalUnits = items.reduce((s,[k,v])=>s+v, 0);

  container.innerHTML = `
    <div class="restock-summary">
      <div class="restock-summary-label">Total à réassortir</div>
      <div class="restock-summary-num">${totalUnits}</div>
      <div class="restock-summary-sub">${items.length} produit${items.length>1?'s':''} concerné${items.length>1?'s':''}</div>
    </div>
    ${Object.entries(byCategory).map(([cat, products])=>`
      <div class="cat-group">
        <div class="cat-header">${cat}</div>
        <div class="cat-items">
          ${products.map(p=>`
            <div class="restock-item">
              <div>
                <div class="restock-item-name">${p.name}</div>
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="restockAdjust('${p.name.replace(/'/g,"\\'")}',-1)">−</button>
                <div class="qty-num">${p.qty}</div>
                <button class="qty-btn" onclick="restockAdjust('${p.name.replace(/'/g,"\\'")}',1)">+</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
    <div class="btn-stack">
      <button class="btn btn-secondary" onclick="copyList()">
        📋 Copier la liste
      </button>
      <button class="btn btn-danger" onclick="resetRestock()">
        Vider la liste
      </button>
    </div>
  `;
}

function restockAdjust(name, delta){
  state.restock[name] = (state.restock[name] || 0) + delta;
  if(state.restock[name] <= 0) delete state.restock[name];
  saveState();
  renderRestock();
  renderHome();
}

function copyList(){
  const items = Object.entries(state.restock).filter(([k,v])=>v>0);
  const text = items.map(([name,qty])=>`${qty}× ${name}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>toast('Liste copiée ✓'));
}

function resetRestock(){
  if(!confirm('Vider toute la liste de réassort ?')) return;
  state.restock = {};
  state.scans = {};
  saveState();
  renderRestock();
  renderHome();
  toast('Liste vidée');
}

// ============================================================
// INIT
// ============================================================
renderHome();
